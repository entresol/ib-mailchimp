subtitle: "Neudenkertreffen in Doros Garten"

intro:
  - "im August sind wir bei Doro zu Gast. Ihr Garten öffnet sich für uns mit viel Grün und etwas Kühlem im Glas. Ein Ort zum Ankommen, Durchatmen und Neudenken in der Nürnberger Nordstadt."
  - "Diesmal drehen wir an der Uhr und treffen uns nachmittags. Sommerlicht, entspannte Runde — bei plötzlichem Wintereinbruch wechseln wir vor den Kamin ;-)"
  - "Wie immer: Kein Programm, keine Agenda, Free Flow. Kommt vorbei, taucht in die Gespräche ein und bringt die Menschen mit, die ihr schon lange dazu einladen wolltet."

