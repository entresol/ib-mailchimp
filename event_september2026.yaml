typ: einladung

betreff: "[neudenken] Einladung zum Neudenkertreffen am Freitag, den 18. September im Möbelkollektiv"
vorschautext: "Die Sommerpause ist vorbei — am Freitag sehen wir uns im Möbelkollektiv."

greeting: "Goeiemiddag,"
subtitle: "Zurück aus der Sommerpause"

intro:
  - "in Bayern beginnt die Schule, damit geht die Sommerpause endgültig zu Ende. Der Rhythmus kehrt zurück, die Köpfe sind wieder da — höchste Zeit, sich wiederzusehen."
  - "Diese Einladung kommt kurzfristig, und das hat einen Grund: Unsere beiden eigentlich geplanten Orte sind nacheinander weggefallen. Das Möbelkollektiv hat spontan die Türen geöffnet — Werkstatt, Arbeitsort und Gemeinschaftsprojekt in einem, ein Haus, in dem Dinge entstehen, weil Menschen sie gemeinsam anfassen."
  - "Wie immer: Kein Programm, keine Agenda, Free Flow. Kommt vorbei, taucht in die Gespräche ein und bringt die Menschen mit, die ihr schon lange dazu einladen wolltet."

