betreff: "[neudenken] Einladung zum Neudenkertreffen am Freitag, den 18. September im Möbelkollektiv"
vorschautext: "Die Sommerpause ist vorbei — am Freitag sehen wir uns im Möbelkollektiv."

greeting: "Goeiemiddag,"
subtitle: "Zurück aus der Sommerpause"

intro:
  - "morgen geht die Sommerpause zu Ende. Der Spurt übernimmt wieder, die Köpfe sind zurück — höchste Zeit, dass wir uns wiederzusehen."
  - "Das Möbelkollektiv lädt uns zum Verweilen ein: Werkstatt, Arbeitsort und Gemeinschaftsprojekte in einem. Ein Ort, an dem Dinge entstehen, weil Menschen sie gemeinsam angehen."
  - "Wie gewohnt: Kein Programm, keine Agenda, Free Flow. Kommt vorbei, taucht in die Gespräche ein und bringt die Menschen mit, die ihr schon lange dazu einladen wolltet."

