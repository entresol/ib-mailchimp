# Neudenkertreffen – Monatliche Veranstaltung
# Standard-Format für ein einzelnes Treffen.
# Für Flowing Invitation (NDF etc.): typ: flowing + events[] + cta_text/cta_url befüllen.

typ: einladung  # einladung | erinnerung | flowing

betreff: "[neudenken] Einladung zum Neudenkertreffen am DD. Monat im Ort"
vorschautext: "Kurzer Vorschautext – erscheint in der Inbox-Vorschau des Mailclients."

# Hero-Sektion (monatlich wechselnd)
greeting: "Hola,"         # Begrüßung auf Zeit — jede Sprache möglich
subtitle: "Untertitel"    # Kursiv, orange — Stimmung/Thema des Monats

# Einleitungstext — eine Liste von Absätzen
intro:
  - "Erster Absatz. Stimmung des Orts, warum wir dort hingehen."
  - "Zweiter Absatz (optional). Kontext, Besonderheit."

# Haupt-Event — immer vorhanden
main_event:
  eyebrow: "Fr, DD. Monat · HH–HH Uhr · Ortsname"
  title: "Ortsname"
  url: "https://ortswebsite.de/"
  description: "Ein bis zwei Sätze: Was erwartet die Teilnehmer? Was ist besonders?"

# Weitere Events — nur bei Flowing Invitation
events: []
# Beispiel:
# events:
#   - eyebrow: "Di, DD. Monat · HH Uhr · Ort"
#     title: "Event-Titel"
#     url: "https://..."
#     description: "Kurze Beschreibung."

# CTA-Link — nur bei Flowing Invitation (wenn events befüllt)
cta_text: ""
cta_url:  ""

# Abschlusstext — leer lässt den Standardtext stehen
closing: ""

# Team — alphabetisch, mit & vor dem letzten Namen
team: "Doro, Florian, Hanna, Ingo, Simon, Sonja, Stefan, Stefan & Thor"
